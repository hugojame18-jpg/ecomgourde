name: Déploiement GitHub Pages

# Le site est compilé en pages HTML statiques puis publié sur GitHub Pages.
# Se déclenche à chaque envoi sur main, ou à la main depuis l'onglet Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les envois suivants attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPORT: "1"
      # Le site vit sous /ecomgourde/ tant qu'aucun domaine n'est branché.
      # Le jour où tu connectes ton domaine : vider BASE_PATH et mettre
      # l'adresse réelle dans NEXT_PUBLIC_SITE_URL.
      BASE_PATH: /ecomgourde
      # Même valeur : sert à préfixer les images de /public.
      NEXT_PUBLIC_BASE_PATH: /ecomgourde
      NEXT_PUBLIC_SITE_URL: https://hugojame18-jpg.github.io/ecomgourde
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: jdwqx1-bw.myshopify.com
    steps:
      - uses: actions/checkout@v4

      # Active GitHub Pages sur le dépôt si ce n'est pas déjà fait.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Sans ce fichier, GitHub Pages ignore les dossiers commençant par un
      # underscore — donc tout /_next, donc le site sans style ni script.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
